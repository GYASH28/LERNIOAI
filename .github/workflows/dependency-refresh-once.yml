name: One-time security lockfile refresh

on:
  push:
    branches:
      - fix/app-completion-critical-flows
    paths:
      - .github/workflows/dependency-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'GYASH28/LERNIOAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Remove vulnerable fixed PostCSS override
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const filename = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(filename, 'utf8'));
          if (pkg.overrides) delete pkg.overrides.postcss;
          fs.writeFileSync(filename, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Re-resolve compatible dependencies and apply security patches
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Save deterministic dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dependency-refresh-once.yml
          git add package.json package-lock.json .github/workflows/dependency-refresh-once.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh compatible security patches and lockfile"
            git push origin HEAD:fix/app-completion-critical-flows
          fi
