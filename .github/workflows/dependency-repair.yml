name: Dependency repair

on:
  push:
    branches:
      - repair/strict-quality-gate-20260816
    paths:
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/strict-quality-gate-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install next@16.3.1 next-auth@4.24.15 sharp@0.35.3 --save-exact
      - run: npm audit fix
      - name: Show remaining audit findings
        run: npm audit --audit-level=high || true
      - name: Commit repaired dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: repair vulnerable dependencies"
          git push origin HEAD:repair/strict-quality-gate-20260816
