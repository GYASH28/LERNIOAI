services:
  postgres:
    image: postgres:16-alpine
    container_name: lernio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: lernio
      POSTGRES_USER: lernio
      POSTGRES_PASSWORD: lernio_password
    ports:
      - "5432:5432"
    volumes:
      - lernio_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lernio -d lernio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lernio_postgres_dev:
